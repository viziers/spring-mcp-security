	// declared in build.gradle if it is not already installed. This keeps the build
	// self-contained — clone and run without manually installing a matching JDK.
	id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'spring-mcp-security'
