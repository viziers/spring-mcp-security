plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.vizier'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring AI BOM (1.1.x GA) manages versions of the MCP server starter below.
	implementation platform('org.springframework.ai:spring-ai-bom:1.1.8')

	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	// OAuth2 client — provides the RFC 8693 token-exchange grant support
	// (TokenExchangeOAuth2AuthorizedClientProvider) used to delegate identity downstream.
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	// AOP — the audit interceptor wraps @Tool methods without touching tool code.
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// Spring AI MCP server, servlet (WebMVC) transport — exposes the Streamable-HTTP
	// MCP endpoint. Version supplied by the BOM above.
	implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
	// Community MCP security module (Spring AI 1.1.x / Spring Security 6.x line). Propagates
	// the SecurityContext into MCP tool execution so method security works on tool methods.
	// NOTE: the plain artifact, not '-spring-boot' (that line targets Spring Boot 4).
	implementation 'org.springaicommunity:mcp-server-security:0.0.6'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// Provides MockMvc security post-processors (e.g. jwt()) to simulate an
	// authenticated principal in tests without a live authorization server.
	testImplementation 'org.springframework.security:spring-security-test'
	// Mock HTTP server to stand in for the authorization server's token endpoint when
	// testing the RFC 8693 exchange.
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
