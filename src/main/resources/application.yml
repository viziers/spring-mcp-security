# ──────────────────────────────────────────────────────────────────────────────
# spring-mcp-security — application configuration
#
# Every property an operator must set to run this resource server lives here, with a
# comment explaining what it does. No secrets are stored in this file; values that vary
# per environment are read from environment variables with a non-secret default so the
# project boots out of the box for local exploration.
# ──────────────────────────────────────────────────────────────────────────────
server:
  # HTTP port for this application. Avoids 8080 (commonly taken — e.g. Jenkins) and 8081
  # (used by the local Keycloak in docker-compose). Override with MCP_SERVER_PORT.
  port: ${MCP_SERVER_PORT:8082}

spring:
  application:
    name: spring-mcp-security
  ai:
    mcp:
      server:
        # Identifies this MCP server to connecting clients.
        name: spring-mcp-security
        version: 0.0.1
        # Streamable-HTTP transport (modern MCP transport). Required by the mcp-security
        # module — the deprecated SSE transport is not supported. Exposes the MCP endpoint
        # at /mcp by default (override: spring.ai.mcp.server.streamable-http.mcp-endpoint).
        protocol: STREAMABLE
  security:
    oauth2:
      resourceserver:
        jwt:
          # JWKS endpoint that publishes the public keys used to verify JWT signatures
          # (RFC 7517). Keys are fetched lazily on first token validation and cached, so
          # the application boots without contacting the authorization server. Point this
          # at your auth server's JWK Set (Keycloak, Auth0, Spring Authorization Server …).
          jwk-set-uri: ${MCP_JWT_JWK_SET_URI:https://auth.example.com/oauth2/jwks}
      client:
        # RFC 8693 token exchange: trade the caller's JWT for a token scoped to a
        # downstream service ("service B"), preserving the caller's identity.
        registration:
          service-b:
            provider: downstream-auth-server
            client-id: ${MCP_TOKEN_EXCHANGE_CLIENT_ID:mcp-server}
            # Externalized — never a real secret in source. Override per environment.
            client-secret: ${MCP_TOKEN_EXCHANGE_CLIENT_SECRET:change-me}
            client-authentication-method: client_secret_basic
            authorization-grant-type: urn:ietf:params:oauth:grant-type:token-exchange
            # Scope requested for the downstream-service token.
            scope:
              - service-b.invoke
        provider:
          downstream-auth-server:
            # Token endpoint of the authorization server. Set directly (not issuer-uri) so
            # there is no OIDC discovery at startup — boot and tests stay decoupled.
            token-uri: ${MCP_TOKEN_EXCHANGE_TOKEN_URI:https://auth.example.com/oauth2/token}

# Resource-server claim expectations. A valid signature alone is not sufficient: a token
# must also be issued by the issuer we trust and minted for this server's audience.
mcp:
  security:
    jwt:
      # Expected `iss` (issuer) claim. Tokens issued by anyone else are rejected, even if
      # signed by a key in the JWKS above.
      issuer: ${MCP_JWT_ISSUER:https://auth.example.com}
      # Expected `aud` (audience) claim — this resource server's identifier. Rejects a
      # token that was minted for a different service (prevents token redirection).
      audience: ${MCP_JWT_AUDIENCE:mcp-server}
    oauth2:
      # Authorization server issuer used by the MCP endpoint's mcp-security chain. The
      # module discovers the server's JWKS/metadata from this issuer and advertises it to
      # MCP clients (RFC 9728). Point this at your OAuth 2.0 authorization server.
      issuer-uri: ${MCP_OAUTH2_ISSUER_URI:https://auth.example.com}
  token-exchange:
    # Audience requested for the exchanged downstream token (RFC 8693 `audience`). Identifies
    # service B so its resource server accepts the token. Not sent by Spring by default.
    audience: ${MCP_TOKEN_EXCHANGE_AUDIENCE:service-b}
  audit:
    # Parameter names (comma-separated, case-insensitive substring match) whose values are
    # redacted in the audit log. Add any tool input field that may carry sensitive data.
    sensitive-parameters: ${MCP_AUDIT_SENSITIVE_PARAMETERS:password,secret,token,credential,authorization}
